# getrandom 0.3 needs this cfg flag (in addition to its `wasm_js` feature) to
# build for wasm32-unknown-unknown, which is the target `just build-wasm` uses
# for crates/chip-wasm. Without it the build fails in getrandom's backends.rs.
# See https://docs.rs/getrandom/0.3.3/#webassembly-support
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
